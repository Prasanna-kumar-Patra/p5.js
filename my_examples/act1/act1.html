<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AND Gate Puzzle</title>
    <!-- Main p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .explanation {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .mode-selector {
            margin-bottom: 20px;
            padding: 10px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .mode-button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .mode-button.active {
            transform: scale(1.05);
            font-weight: bold;
        }

        .mode-button.play {
            background-color: #4CAF50;
            color: white;
        }

        .mode-button.test {
            background-color: #2196F3;
            color: white;
        }

        .mode-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        .play-mode {
            background-color: #4CAF50;
            color: white;
        }

        .test-mode {
            background-color: #2196F3;
            color: white;
        }

        /* Toast styling */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background-color: white;
            color: #333;
            padding: 12px 24px;
            border-radius: 4px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            animation: slideIn 0.3s ease-out;
            max-width: 300px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .toast.success {
            border-left: 4px solid #4CAF50;
        }

        .toast.error {
            border-left: 4px solid #f44336;
        }

        .toast.show {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        #canvas-container {
            position: relative;
            width: 800px;
            height: 400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AND Gates</h1>
        <p>There are millions of logic gates inside every modern computer. Let's see how they work.</p>

        <div class="mode-selector">
            <button class="mode-button play active" data-mode="play">Play Mode</button>
            <button class="mode-button test" data-mode="test">Test Mode</button>
        </div>

        <div class="mode-indicator play-mode">Play Mode</div>

        <div id="canvas-container"></div>

        <div class="controls">
            <button id="restart">Restart</button>
            <button id="check">Check</button>
            <button id="next">Next</button>
        </div>

        <div class="explanation" id="explanation">
            <h3>Explanation</h3>
            <p id="explanation-text"></p>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="sketch.js"></script>
</body>

</html>
