<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Logic Gates</title>
    <!-- Main p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .controls {
            margin-top: 20px;
        }

        .navigation button,
        .controls button {
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            color: white;
        }

        #restart {
            background-color: #FF5722;
            /* Deep Orange */
        }

        #check {
            background-color: #2196F3;
            /* Blue */
        }

        #show-answer {
            background-color: #4CAF50;
            /* Green */
        }

        #prev-question,
        #next {
            background-color: #9C27B0;
            /* Purple */
        }

        .navigation button:hover,
        .controls button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .navigation button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .answer-hint {
            position: absolute;
            left: 50px;
            background-color: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .answer-hint.show {
            opacity: 1;
        }

        .mode-selector {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mode-toggle {
            position: relative;
            width: 200px;
            height: 40px;
            background-color: #e0e0e0;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
        }

        .mode-toggle span {
            z-index: 1;
            color: #666;
            font-weight: bold;
            padding: 0 10px;
        }

        .mode-toggle .slider {
            position: absolute;
            width: 50%;
            height: 34px;
            background-color: white;
            border-radius: 17px;
            transition: transform 0.3s ease;
            left: 3px;
        }

        .mode-toggle.test .slider {
            transform: translateX(0);
        }

        .mode-toggle.live .slider {
            transform: translateX(94px);
        }

        .mode-indicator {
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            background: transparent;
            border: none;
        }

        .play-mode .mode-indicator {
            color: #4CAF50;
        }

        .test-mode .mode-indicator {
            color: #2196F3;
        }

        .gate-selector {
            margin: 10px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .gate-button {
            padding: 5px 15px;
            border: 2px solid #4CAF50;
            border-radius: 4px;
            background: white;
            color: #4CAF50;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gate-button.active {
            background: #4CAF50;
            color: white;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 10px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .nav-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Toast styling */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .toast {
            background-color: white;
            color: #333;
            padding: 12px 24px;
            border-radius: 4px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            animation: slideIn 0.3s ease-out;
            max-width: 300px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .toast.success {
            border-left: 4px solid #4CAF50;
        }

        .toast.error {
            border-left: 4px solid #f44336;
        }

        .toast.show {
            opacity: 1;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        #canvas-container {
            position: relative;
            width: 800px;
            height: 400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Logic Gates</h1>
        <p>There are millions of logic gates inside every modern computer. Let's see how they work.</p>

        <div class="mode-selector">
            <div class="mode-toggle test">
                <span>Test</span>
                <span>Live</span>
                <div class="slider"></div>
            </div>
            <div class="mode-indicator">Test Mode</div>
        </div>

        <div class="gate-selector">
            <button class="gate-button active" data-gate="AND">AND</button>
            <button class="gate-button" data-gate="OR">OR</button>
            <button class="gate-button" data-gate="NOT">NOT</button>
            <button class="gate-button" data-gate="NAND">NAND</button>
            <button class="gate-button" data-gate="NOR">NOR</button>
            <button class="gate-button" data-gate="XOR">XOR</button>
            <button class="gate-button" data-gate="XNOR">XNOR</button>
        </div>

        <div id="canvas-container"></div>

        <div class="navigation">
            <div class="nav-group">
                <button id="restart">Restart</button>
                <button id="check">Check</button>
                <button id="show-answer">Show Answer</button>
            </div>
            <div class="nav-group">
                <span id="question-count">Question 1 of 11</span>
                <button id="prev-question">Previous</button>
                <button id="next">Next</button>
            </div>
        </div>

        <div class="explanation" id="explanation">
            <h3>Explanation</h3>
            <p id="explanation-text"></p>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="sketch.js"></script>
</body>

</html>
